[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-document-intelligence-backend"
version = "0.1.0"
description = "BFSI document intelligence platform backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic-settings>=2.6,<3.0",
  "python-multipart>=0.0.9,<1.0",
]

[project.optional-dependencies]
data = [
  "sqlalchemy[asyncio]>=2.0,<3.0",
  "asyncpg>=0.29,<1.0",
  "alembic>=1.14,<2.0",
  "redis>=5.0,<6.0",
]
intelligence = [
  "langchain>=0.3,<1.0",
  "langgraph>=0.2,<1.0",
  "spacy>=3.7,<4.0",
  "scikit-learn>=1.5,<2.0",
  "xgboost>=2.1,<3.0",
  "torch>=2.4,<3.0",
  "pytesseract>=0.3,<1.0",
  "Pillow>=10.4,<12.0",
]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.24,<1.0",
  "httpx>=0.27,<1.0",
  "ruff>=0.8,<1.0",
  "mypy>=1.13,<2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
